name: CI

# 三件事：后端质量门、客户端质量门、对真实服务跑的接口回归。
# 端到端测试（integration_test）不在 CI 里跑——它需要真实窗口与 libmpv，
# 在无显示器的 runner 上跑不起来，见 技术文档.md 的验证策略。

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: 后端
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: gofmt
        working-directory: backend
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "以下文件未格式化，请跑 gofmt -w："
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        working-directory: backend
        run: go vet ./...

      - name: go test
        working-directory: backend
        run: go test -count=1 ./...

      - name: 构建静态二进制
        working-directory: backend
        run: CGO_ENABLED=0 go build -trimpath -o /tmp/mediacenter .

  client:
    name: 客户端
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.4
          channel: stable
          cache: true

      - name: pub get
        working-directory: client
        run: flutter pub get

      - name: analyze
        working-directory: client
        run: flutter analyze

      - name: test
        working-directory: client
        run: flutter test

  api:
    name: 接口回归
    runs-on: ubuntu-latest
    needs: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      # 缩略图与测试素材都靠 ffmpeg；verify-api 里有一条断言直接检查
      # /api/stats 的 ffmpeg_available，缺了它会失败而不是跳过。
      - name: 安装 ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg

      - name: 构建
        working-directory: backend
        run: CGO_ENABLED=0 go build -trimpath -o /tmp/mediacenter .

      - name: 生成测试素材
        run: ./scripts/make-test-media.sh /tmp/mc-test-media

      - name: 启动服务并完成首次扫描
        run: |
          set -euo pipefail
          mkdir -p /tmp/mc-data
          # -mdns=false：runner 上没有组播环境，广播失败会刷一堆日志
          /tmp/mediacenter -data /tmp/mc-data -port 18080 -mdns=false \
            > /tmp/mc-server.log 2>&1 &

          ready=0
          for _ in $(seq 1 100); do
            if curl -sf --noproxy '*' http://127.0.0.1:18080/api/ping > /dev/null; then
              ready=1; break
            fi
            sleep 0.2
          done
          if [ "$ready" != "1" ]; then
            echo "服务端未能在 20 秒内就绪，日志如下："
            cat /tmp/mc-server.log
            exit 1
          fi

          token="$(python3 -c "import json;print(json.load(open('/tmp/mc-data/config.json'))['token'])")"
          echo "MC_TOKEN=$token" >> "$GITHUB_ENV"

          curl -sf --noproxy '*' -X POST http://127.0.0.1:18080/api/folders \
            -H "Authorization: Bearer $token" \
            -H 'Content-Type: application/json' \
            -d '{"path":"/tmp/mc-test-media"}' > /dev/null

          for _ in $(seq 1 150); do
            running="$(curl -s --noproxy '*' -H "Authorization: Bearer $token" \
              http://127.0.0.1:18080/api/scan/status \
              | python3 -c 'import sys,json;print(json.load(sys.stdin)["running"])')"
            if [ "$running" = "False" ]; then break; fi
            sleep 0.2
          done
          curl -s --noproxy '*' -H "Authorization: Bearer $token" \
            http://127.0.0.1:18080/api/scan/status

      - name: verify-api
        run: ./scripts/verify-api.sh http://127.0.0.1:18080

      # G 段（级联）要求文件落在扫描目录内，这里两边都指向同一份测试素材，
      # 所以能跑满 43 项而不是跳过。
      - name: verify-albums
        env:
          MC_CASCADE_FILE: /tmp/mc-test-media/photos/IMG_0001.jpg
        run: ./scripts/verify-albums.sh http://127.0.0.1:18080

      # 这个脚本自带服务端与独立数据目录（默认 18091），跑完自己清理。
      - name: verify-upload
        run: ./scripts/verify-upload.sh

      - name: 失败时输出服务端日志
        if: failure()
        run: cat /tmp/mc-server.log || true
